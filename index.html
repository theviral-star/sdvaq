  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .video-page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* BACKGROUND */
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* DARK OVERLAY */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
      pointer-events: none;
    }

    /* MAIN VIDEO */
    .main-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: contain;
      z-index: 3;
      cursor: pointer;
    }

    /* TOP NAVIGATION */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 35px;
      color: #fff;
      font-size: 18px;
      z-index: 5;
      pointer-events: none;
    }

    .top-bar span {
      padding: 10px 20px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.55);
    }

    /* WATCH / PLAY BUTTON */
    .watch-button {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      border: none;
      border-radius: 50%;
      padding: 0;
      background: #4fc3f7;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      z-index: 6;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .watch-button:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
    }

    .watch-button::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 8px;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-left: 36px solid #fff;
    }

    .watch-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    /* PROGRESS BAR */
    .progress {

      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 7;

    .progress-bar {

      height: 100%;
      background: #ff0000;

  <!-- VIDEO PLAYER SCRIPT -->
  <script>
    (function() {
      const video = document.getElementById('mainVideo');
      const button = document.getElementById('watchButton');
      const progressBar = document.getElementById('progressBar');

      // Play video directly when the button is clicked
      button.addEventListener('click', async function() {
        try {
          video.muted = false;
          await video.play();
          button.style.display = 'none';
        } catch (error) {
          // Retry muted if sound playback is blocked
          try {
            video.muted = true;
            await video.play();
            button.style.display = 'none';
          } catch (playError) {
            button.style.display = 'flex';
            console.error('Unable to play video:', playError);
          }
        }
      });

      // Clicking the video toggles play and pause
      video.addEventListener('click', async function() {
        if (video.paused) {
          try {
            await video.play();
            button.style.display = 'none';
          } catch (error) {
            console.error('Unable to play video:', error);
          }
        } else {
          video.pause();
          button.style.display = 'flex';
        }
      });

      // Update progress bar
      video.addEventListener('timeupdate', function() {
        if (video.duration && isFinite(video.duration)) {
          const percentage =
            (video.currentTime / video.duration) * 100;

          progressBar.style.width = percentage + '%';
        }
      });

      // Reset progress when video loops or restarts
      video.addEventListener('ended', function() {
        button.style.display = 'flex';
        progressBar.style.width = '0%';
      });

      // Show the play button if playback fails
      video.addEventListener('error', function() {
        button.style.display = 'flex';
      });
    })();
  </script>
